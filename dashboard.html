<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nova guia</title>
<style>
  :root {
    --bg: #000; --panel: #0a0a0a; --border: #262626; --border-hi: #404040;
    --text: #ededed; --dim: #888; --accent: #0070f3; --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse 120% 70% at 50% 110%, rgba(0,112,243,.06), transparent 60%), var(--bg);
    color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 9vh;
  }
  .tri { width: 34px; height: 30px; margin-bottom: 18px; opacity: .9; }
  .clock { font-size: 64px; font-weight: 600; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .date { color: var(--dim); font-size: 15px; margin-top: 2px; }
  .searchwrap { margin-top: 36px; width: min(620px, 86vw); display: flex; gap: 8px; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px;
    transition: border-color .15s; }
  .searchwrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,112,243,.15); }
  .searchwrap svg { flex: none; opacity: .55; }
  #q { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font-size: 16px; }
  #q::placeholder { color: #555; }
  #engine { background: #111; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 13px; outline: 0; cursor: pointer; }
  .kbd { color: #555; font-size: 12px; border: 1px solid var(--border); border-radius: 5px; padding: 1px 7px; }
  .grid { margin-top: 34px; width: min(620px, 86vw); display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px;
    text-decoration: none; color: var(--text); transition: .15s; }
  .card:hover { border-color: var(--border-hi); transform: translateY(-1px); }
  .card .t { font-size: 14px; font-weight: 500; }
  .card .s { color: var(--dim); font-size: 11.5px; margin-top: 3px; }
  .section { margin-top: 30px; width: min(620px, 86vw); }
  .section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px;
    color: var(--text); font-size: 13px; text-decoration: none; transition: .15s; max-width: 190px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:hover { border-color: var(--accent); }
  footer { margin-top: auto; padding: 22px; color: #333; font-size: 12px; }
</style>
</head>
<body>
  <svg class="tri" viewBox="0 0 76 65" fill="#fff"><path d="M37.59.25l36.95 64H.64l36.95-64z"/></svg>
  <div class="clock" id="clock">--:--</div>
  <div class="date" id="date"></div>

  <div class="searchwrap">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ededed" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="Buscar...  ( pressione / para focar )" autofocus autocomplete="off">
    <select id="engine">
      <option value="google">Google</option>
      <option value="github">GitHub</option>
      <option value="npm">npm</option>
      <option value="mdn">MDN</option>
      <option value="so">Stack Overflow</option>
      <option value="vercel">Vercel Docs</option>
      <option value="gpt">ChatGPT</option>
    </select>
    <span class="kbd">Enter</span>
  </div>

  <div class="grid" id="links"></div>

  <div class="section">
    <h3>Mais visitados</h3>
    <div class="chips" id="top"></div>
  </div>

  <footer>Vercel Dev Dashboard &middot; / para buscar</footer>
  <script src="dashboard.js"></script>
</body>
</html>
